<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI Office">
<meta name="description" content="A pixel office of AI agents you hire, give tickets to and review.">
<title>The AI Office</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231f7a74'/%3E%3Crect x='3' y='4' width='10' height='6' fill='%23b9f3e4'/%3E%3Crect x='6' y='11' width='4' height='2' fill='%23b9f3e4'/%3E%3C/svg%3E">
<script src="/runtime.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-screen app. Top bar; left = office (or CEO wall of screens) over a 4-column board; right = an edit panel for whatever is selected. Nothing on the page scrolls; panels scroll inside. */
:root {
  --bg: #e9ecf1;
  --panel: #f8f9fb;
  --ink: #1c2230;
  --muted: #5d6677;
  --line: #d3d8e1;
  --accent: #1f7a74;
  --accent-ink: #ffffff;
  --accent-soft: #d5ece9;
  --warn: #b5651d;
  --warn-soft: #f6e6d6;
  --danger: #b3261e;
  --screen-bg: #0f1a1f;
  --screen-ink: #b9f3e4;
  --screen-dim: #5f8f86;
  --font-display: "Pixelify Sans", "Courier New", monospace;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141821; --panel: #1c212c; --ink: #e6e9ef; --muted: #99a2b3; --line: #2d3442;
    --accent: #4fc1b7; --accent-ink: #0f1a1f; --accent-soft: #1d3a3a; --warn: #e39a52; --warn-soft: #3a2a1c; --danger: #f08a80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141821; --panel: #1c212c; --ink: #e6e9ef; --muted: #99a2b3; --line: #2d3442;
  --accent: #4fc1b7; --accent-ink: #0f1a1f; --accent-soft: #1d3a3a; --warn: #e39a52; --warn-soft: #3a2a1c; --danger: #f08a80; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.4; overflow: hidden; }
.app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 10px; padding-inline: 16px; padding-block: 10px; }
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1; margin: 0; letter-spacing: .5px; white-space: nowrap; }
h2 { font-family: var(--font-display); font-weight: 500; font-size: 17px; margin: 0; letter-spacing: .03em; }
h3 { margin: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stats { display: flex; gap: 14px; font-variant-numeric: tabular-nums; }
.stat { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; }
.stat b { font-family: var(--font-display); font-size: 18px; }
.stat span { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.spacer { flex: 1; }
.tabs { display: flex; gap: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
.tabs button { border: 0; background: none; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
button, select, input, textarea { font: inherit; font-size: 13.5px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; }
button { cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
button.ghost { background: none; }
button.small { font-size: 12.5px; padding: 3px 8px; }
button.danger { color: var(--danger); border-color: var(--danger); background: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.notice { font-size: 12.5px; color: var(--warn); background: var(--warn-soft); border-radius: 8px; padding: 5px 10px; margin: 0; }
.notice:empty { display: none; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 12px; min-height: 0; grid-row: 3; }  /* stays in the stretchy row even when the notice is hidden */
.left { position: relative; display: grid; grid-template-rows: minmax(0, 1fr) minmax(150px, 34%); gap: 12px; min-height: 0; min-width: 0; }
.stage { position: relative; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
canvas { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; border-radius: 6px; cursor: pointer; flex: none; }
.ceo { min-height: 0; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.ceo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.ceo-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; margin-bottom: 8px; }
.ceo-head p { margin: 0; color: var(--muted); font-size: 12.5px; }

/* big preview layer over the left area */
.preview { position: absolute; inset: 0; background: var(--panel); border-radius: 10px; display: flex; flex-direction: column; z-index: 3; }
.preview-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.preview-b { flex: 1; min-height: 0; overflow: auto; padding: 10px; }
.preview-b iframe { width: 100%; height: 100%; border: 0; background: #fff; border-radius: 6px; }

/* board */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; min-height: 0; }
.col { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.col h3 { padding: 8px 10px 4px; display: flex; justify-content: space-between; }
.col-list { overflow-y: auto; padding: 4px 8px 8px; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.empty { font-size: 12.5px; color: var(--muted); margin: 0; padding: 4px 2px; }
.tk { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; text-align: left; }
.tk.owned { background: color-mix(in srgb, var(--agent) 22%, var(--bg)); border-color: color-mix(in srgb, var(--agent) 60%, var(--line)); border-left: 5px solid var(--agent); }
.tk:hover { border-color: var(--accent); }
.tk.owned.sel, .tk.owned:hover { border-left-color: var(--agent); }
.tk.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.tk-t { font-weight: 700; font-size: 13px; overflow-wrap: anywhere; }
.tk-t small { color: var(--muted); font-weight: 400; margin-right: 4px; font-variant-numeric: tabular-nums; }
.tk-meta { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.tk-meta .grow { flex: 1; }
.kind { font-size: 10.5px; padding: 1px 6px; border-radius: 4px; font-weight: 700; color: #3b2f10; }
.kind.design { background: #f5b3cd; } .kind.code { background: #f4d76a; } .kind.writing { background: #a9d6f5; } .kind.steps { background: #b8e6c4; } .kind.video { background: #d6c4f5; }
.preview-b .lv { max-width: 1100px; margin: 0 auto; }
.photo-in { font-size: 13px; color: var(--muted); }
.pdf-chip { font-size: 13px; margin: 6px 0; padding: 6px 10px; border-radius: 8px; border: 1px solid rgb(127 127 127 / .35); display: inline-block; }
.av { width: 26px; height: 26px; border-radius: 50%; flex: none; display: inline-grid; place-items: center; font-family: var(--font-display); color: #fff; font-size: 13px; }
.av.xs { width: 16px; height: 16px; font-size: 9px; }
.pill { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; padding: 2px 7px; border-radius: 999px; background: var(--line); color: var(--muted); white-space: nowrap; }
.pill.live { background: var(--accent); color: var(--accent-ink); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }

/* edit panel */
.insp { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.insp-h { display: flex; align-items: center; gap: 8px; }
.insp-h .eyebrow { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.insp-h .grow { flex: 1; }
.saved { font-size: 12px; color: var(--accent); }
.insp-empty { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.insp-empty p { margin: 0; color: var(--muted); }
label { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; font-weight: 700; min-width: 0; }
label span { font-weight: 400; color: var(--muted); }
textarea { resize: vertical; min-height: 60px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.err { font-size: 12.5px; color: var(--warn); margin: 0; }
.err-detail { font-size: 11.5px; opacity: .7; margin: 2px 0 0; overflow-wrap: anywhere; }
.list { display: flex; flex-direction: column; gap: 4px; }
.list button { text-align: left; display: flex; gap: 6px; align-items: center; background: var(--bg); }
.list button .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sect { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.confirm { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; }
.pr-mini iframe { width: 100%; height: 190px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.md { overflow-wrap: anywhere; min-width: 0; }
.pr-mini .md { max-height: 220px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--bg); }
.md pre { background: var(--screen-bg); color: var(--screen-ink); padding: 8px; border-radius: 6px; overflow-x: auto; font-size: 12px; font-family: var(--font-mono); }
.md code { font-family: var(--font-mono); font-size: .92em; }
.md h2, .md h3, .md h4 { font-family: var(--font-body); font-weight: 700; margin: 12px 0 4px; font-size: 15px; letter-spacing: 0; text-transform: none; color: var(--ink); }
.md p { margin: 0 0 8px; }
.fb { font-size: 12.5px; color: var(--muted); margin: 0; padding-left: 18px; }

/* screen-share card */
.scr { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.scr.boxed { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.scr-top { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.who { min-width: 0; flex: 1; }
.who b { display: block; }
.who small { color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.monitor { background: #2a2f38; border-radius: 9px; padding: 6px; }
.screen { background: var(--screen-bg); color: var(--screen-ink); font-family: var(--font-mono); font-size: 11px; line-height: 1.5; border-radius: 5px; padding: 7px 9px; height: 170px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; margin: 0; }
.screen .dim { color: var(--screen-dim); }
.screen .cur { display: inline-block; width: 7px; height: 12px; background: var(--screen-ink); vertical-align: -2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .screen .cur { animation: none; } }
.say { display: flex; gap: 6px; }
.say input { flex: 1; min-width: 0; }
.scr-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 7px 14px; border-radius: 8px; font-size: 13.5px; z-index: 20; max-width: calc(100% - 32px); }

/* focus mode: only the moving office; everything else opens on demand */
.fbar { display: none; }
body.focus .app { padding: 0; gap: 0; grid-template-rows: minmax(0, 1fr); }
body.focus .top, body.focus .notice { display: none; }
body.focus .main { grid-template-columns: minmax(0, 1fr); gap: 0; grid-row: auto; }
body.focus .left { grid-template-rows: minmax(0, 1fr); gap: 0; }
body.focus .stage { border: 0; border-radius: 0; padding: 0; background: #262a33; }
body.focus canvas { border-radius: 0; }
body.focus .board { display: none; }
body.focus.show-board .board { display: grid; position: absolute; left: 12px; right: 12px; bottom: 12px; height: 42%; z-index: 4; background: var(--bg); padding: 10px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
body.focus .ceo { position: absolute; inset: 60px 12px 12px; z-index: 4; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
body.focus .insp { display: none; }
body.focus.show-insp .insp { display: flex; position: fixed; top: 60px; right: 12px; bottom: 12px; width: min(400px, calc(100% - 24px)); z-index: 6; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
body.focus .preview { z-index: 5; }
@media (min-width: 901px) { body.focus.show-insp.show-board .board, body.focus.show-insp .ceo { right: 424px; } }
body.focus .fbar { display: flex; position: absolute; top: 10px; left: 12px; right: 12px; z-index: 7; gap: 6px; flex-wrap: wrap; align-items: center; pointer-events: none; }
.fbar > * { pointer-events: auto; }
.fbar button { background: rgba(20,24,33,.78); color: #fff; border-color: rgba(255,255,255,.18); backdrop-filter: blur(4px); }
.fbar button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.fbar .fstats { background: rgba(20,24,33,.78); color: #fff; border-radius: 6px; padding: 5px 10px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.fbar .grow { flex: 1; pointer-events: none; }

/* Jarvis */
.j-open { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 9; display: flex; align-items: center; gap: 8px; border-radius: 999px; padding: 8px 16px 8px 10px; background: #10232a; color: #bff4ea; border: 1px solid #2f6f6a; font-family: var(--font-display); font-size: 15px; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
.j-orb { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #e9fffb, #4fe3cf 45%, #147a74 80%); box-shadow: 0 0 10px #4fe3cf; }
.jarvis { position: fixed; right: 16px; bottom: calc(68px + env(safe-area-inset-bottom, 0px)); width: min(400px, calc(100% - 32px)); height: min(540px, calc(100% - 100px)); z-index: 9; background: #0f1b20; color: #dff7f2; border: 1px solid #2f6f6a; border-radius: 14px; display: flex; flex-direction: column; box-shadow: 0 16px 50px rgba(0,0,0,.45); }
.j-h { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid #1f3d40; }
.j-h h2 { color: #bff4ea; flex: 1; }
.j-h label { flex-direction: row; align-items: center; gap: 5px; font-weight: 400; font-size: 12px; color: #9cc9c1; }
.jarvis button { background: #173036; color: #dff7f2; border-color: #2f6f6a; }
.jarvis button.primary { background: #4fe3cf; color: #0f1b20; border-color: #4fe3cf; }
.jarvis button[aria-pressed="true"] { background: #e0705a; border-color: #e0705a; color: #fff; }
.j-log { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.j-hint { margin: 0; font-size: 13px; color: #9cc9c1; line-height: 1.5; }
.j-hint b { color: #dff7f2; font-weight: 400; }
.j-msg { max-width: 88%; padding: 7px 10px; border-radius: 10px; font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.j-msg.me { align-self: flex-end; background: #2f6f6a; color: #fff; }
.j-msg.bot { align-self: flex-start; background: #173036; }
.j-msg.thinking { color: #9cc9c1; font-style: italic; }
.j-acts { margin-top: 4px; font-size: 11.5px; color: #8fe9d9; }
.j-att { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-top: 1px solid #1f3d40; font-size: 12.5px; color: #9cc9c1; }
.j-att img { height: 44px; border-radius: 4px; border: 1px solid #2f6f6a; }
.j-form { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid #1f3d40; align-items: center; }
.j-form input[type=text] { flex: 1; min-width: 0; background: #0a1417; color: #eafffb; border-color: #2f6f6a; font-size: 15px; }
.j-file { position: relative; overflow: hidden; }
.j-file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.shot { max-width: 100%; max-height: 160px; border-radius: 6px; border: 1px solid var(--line); align-self: flex-start; }

/* narrow screens: fall back to a scrolling stack */
@media (max-width: 900px), (max-height: 520px) {
  body { overflow: auto; }
  .app { height: auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .left { grid-template-rows: auto auto; }
  .stage { display: block; }
  canvas { width: 100%; max-height: none; }
  .ceo { max-height: 70vh; }
  .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .col-list { max-height: 260px; }
  .insp { overflow: visible; }
  .preview { position: fixed; inset: 8px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>The AI Office</h1>
    <div class="stats">
      <div class="stat"><b id="st-open">0</b><span>Tickets</span></div>
      <div class="stat"><b id="st-work">0</b><span>Working</span></div>
      <div class="stat"><b id="st-pr">0</b><span>PRs</span></div>
      <div class="stat"><b id="st-merged">0</b><span>Done</span></div>
    </div>
    <div class="spacer"></div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-floor" aria-selected="true">Office floor</button>
      <button type="button" role="tab" id="tab-ceo" aria-selected="false">CEO office</button>
    </div>
    <div class="actions">
      <button type="button" id="btn-hire">Hire an agent</button>
      <button type="button" class="primary" id="btn-ticket">New ticket</button>
      <button type="button" id="btn-full" title="Show only the office">Full screen</button>
    </div>
  </div>
  <p class="notice" id="notice"></p>

  <div class="main">
    <div class="left">
      <div class="stage" id="view-floor">
        <canvas id="office" width="960" height="600" aria-label="Top-down view of the office floor. Click an agent to open them."></canvas>
      </div>
      <div class="ceo" id="view-ceo" hidden>
        <div class="ceo-head"><h2>CEO office</h2><p>Every agent's screen at once. Type a note to redirect someone mid-task.</p></div>
        <div class="ceo-grid" id="ceo-grid"></div>
      </div>
      <section class="board" id="board">
        <div class="col" data-col="todo"><h3>Tickets <span></span></h3><div class="col-list"></div></div>
        <div class="col" data-col="working"><h3>In progress <span></span></h3><div class="col-list"></div></div>
        <div class="col" data-col="review"><h3>Pull requests <span></span></h3><div class="col-list"></div></div>
        <div class="col" data-col="merged"><h3>Done <span></span></h3><div class="col-list"></div></div>
      </section>
      <div class="preview" id="preview" hidden></div>
      <div class="fbar" id="fbar">
        <button type="button" id="f-board" aria-pressed="false">Tickets and PRs</button>
        <button type="button" id="f-ceo" aria-pressed="false">CEO office</button>
        <button type="button" id="f-panel" aria-pressed="false">Details</button>
        <button type="button" id="f-ticket">New ticket</button>
        <button type="button" id="f-hire">Hire</button>
        <span class="fstats" id="f-stats"></span>
        <span class="grow"></span>
        <button type="button" id="f-exit">Exit full screen</button>
      </div>
    </div>
    <aside class="insp" id="insp" aria-live="polite"></aside>
  </div>
</div>
<datalist id="roles"><option value="Frontend engineer"><option value="Backend engineer"><option value="Product designer"><option value="Copywriter"><option value="Researcher"><option value="QA engineer"></datalist>
<button type="button" class="j-open" id="j-open" aria-expanded="false" aria-controls="jarvis"><span class="j-orb"></span>Jarvis</button>
<section class="jarvis" id="jarvis" hidden aria-label="Jarvis assistant">
  <div class="j-h"><span class="j-orb"></span><h2>Jarvis</h2><label><input type="checkbox" id="j-speak"> Speak replies</label><button type="button" class="small" id="j-close">Close</button></div>
  <div class="j-log" id="j-log" aria-live="polite"></div>

    <span class="j-file"><button type="button" class="small" tabindex="-1">Screenshot</button><input type="file" id="j-file" accept="image/*" aria-label="Attach a screenshot"></span>

    <button type="submit" class="primary small" id="j-send">Send</button>
  </form>
</section>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
// ================= state =================
const S = { staff: [], tickets: [], db: null, sample: null, dl: null, assets: null, mode: 'loading' };
const memImages = {};  // ticketId -> screenshot Blob attached in this view
const runs = {};          // staffId -> { ticketId, ctl, text, phase, redirect }
const actors = {};        // staffId -> canvas figure
let selectedId = null, view = 'floor', bootDone = false;
const PALETTE = ['#3fa37a', '#e06fa6', '#5a8de0', '#e0b43f', '#e0705a', '#8a6bd1', '#2fa7b8', '#b0793f'];
const LOOKS = [['#3b2418', '#e9b995'], ['#1d1d24', '#c68a5e'], ['#8a4b22', '#f0c9a4'], ['#d9c27a', '#e6b48f'], ['#16161a', '#a8714a'], ['#5a3a8a', '#f2cfae'], ['#6b2f1a', '#d9a077'], ['#2b2b2b', '#8d5a3b']];
const FORMATS = {
  design: 'Deliver your work as ONE complete, self-contained HTML document with inline CSS only: no scripts, no external images, fonts or links. If the ticket asks for variations, show them side by side on the page, each labeled. Reply with only the HTML.',
  code: 'Deliver working code as a pull request. Start with a short "Summary" paragraph, then each file as a fenced code block preceded by its file path on its own line. Keep it focused, under about 250 lines total.',
  writing: 'Deliver the finished text in Markdown. No preamble.',
  steps: 'You are tutoring a student with homework or a quiz. Solve it and teach it. If an image or PDF is attached, read the problem from it; if the ticket names particular problems or pages, do only those, otherwise do each problem in turn. Reply in Markdown with no preamble: "## Problem" restating it in a line or two; "## Steps" with "### Step 1: <short name>" and so on, each step one to three short sentences saying what to do and why, with any working on its own line in a code block; "## Answer" with the final answer in bold; then "## Try one" with a similar practice problem and its answer on the last line after "Answer:". Use plain words a 12-year-old can follow, and double-check the math.',
  video: 'You are making a short narrated explainer video that walks a student through the solution step by step. If an image or PDF is attached, read the problem from it (if the ticket names a particular problem or page, use that one). Reply with only JSON, no code fences or other text, in this shape: {"title":"<short title>","scenes":[{"heading":"<short heading>","lines":["<up to 4 short lines shown on screen: the working, equations or key words>"],"narration":"<1 to 3 friendly spoken sentences explaining this step>"}]}. Narrate like an upbeat TV science-show host: curious, excited and warm, with short punchy sentences, a quick real-world hook in the first scene, and little bursts of energy like "Now here is the cool part!" or "Watch this!" when a step clicks. Keep it clear, not silly, and never impersonate or name a real person. Use 4 to 10 scenes: the first shows the problem, then one scene per step, and the last gives the final answer and a quick tip. Narration is read aloud by a computer voice, so write math the way you would say it ("x squared", "divided by"); on-screen lines can use symbols. Double-check the math.',
};
const KIND_LABEL = { design: 'Design', code: 'Code', writing: 'Writing', steps: 'Step-by-step', video: 'Video lesson' };
const TUTOR = /educat|tutor|teach/i;
const HIDE_CODES = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed', 'not_configured', 'not_allowed'];
const ERR = {
  rate_limited: 'Hit a usage limit. Try again in a bit.', session_expired: 'Your sign-in expired. Reload the page, then retry.',
  refused: 'Claude declined this ticket. Try rewording it.', empty_completion: 'The agent came back empty. Try simplifying the ticket.',
  prompt_too_large: 'The ticket plus earlier work is too long. Trim the details.', not_granted: 'Claude access was declined for this page.',
  sampling_disabled: "Claude isn't available for this account.",
  daily_limit: "That's today's Jarvis allowance. It resets at midnight (UTC).", ticket_limit: "You've used this month's tickets. Ask the office owner for more.",
  bad_api_key: "The site's Claude API key isn't working. Check it in Vercel.", not_configured: "The site isn't fully set up yet.",
  not_allowed: "Your account isn't allowed to use this office.", network: 'Lost the connection mid-task. Try again.',
  too_big: 'That PDF is too big for Claude. Attach just the pages with the problems.', bad_doc: "The attached file isn't a readable PDF.",
  bad_image: "The photo's format can't be read. Attach a screenshot or a JPG of the problem instead.",
  invalid_request: "Claude couldn't read this ticket or its photo. Try a clearer screenshot of the problem.",
  upstream_error: 'Claude had a hiccup. Try again.', missing: "The attached photo couldn't be found. Attach it again.",
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const getS = id => S.staff.find(s => s.id === id);
const getT = id => S.tickets.find(t => t.id === id);
const staffSorted = () => S.staff.slice().sort((a, b) => (a.hiredAt || 0) - (b.hiredAt || 0));
function toast(msg, ms = 3200) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, ms); }

// ================= storage =================
const writeQ = {};
function upsert(list, obj) { const i = list.findIndex(x => x.id === obj.id); if (i >= 0) list[i] = obj; else list.push(obj); }
function persist(coll, obj) {
  if (!S.db) return Promise.resolve();
  const key = coll + '/' + obj.id;
  const body = { ...obj }; delete body.id;
  writeQ[key] = (writeQ[key] || Promise.resolve()).then(() => S.db.doc(key).set(body)).catch(e => {
    toast(e && e.code === 'quota_exceeded' ? 'The office is out of storage. Delete some done tickets.' : "Couldn't save that change. Check your access to this page.");
  });
  return writeQ[key];
}
function putStaff(s) { upsert(S.staff, s); syncActors(); renderAll(); return persist('staff', s); }
function putTicket(t) { upsert(S.tickets, t); renderAll(); return persist('tickets', t); }
function patchTicket(id, patch) { const t = getT(id); if (!t) return Promise.resolve(); return putTicket({ ...t, ...patch, updatedAt: Date.now() }); }
function removeTicket(id) {
  S.tickets = S.tickets.filter(t => t.id !== id); renderAll();
  if (S.db) S.db.doc('tickets/' + id).delete().catch(() => toast("Couldn't delete that ticket."));
}

// ================= agents at work =================
function buildPrompt(t, s, compact, hasImg, hasPdf) {
  const parts = [`You are ${s.name}, the ${s.role} at "The AI Office", a small team of AI agents managed by a human CEO. You are working on one ticket.`];
  if (s.instructions) parts.push(`Your standing instructions from the CEO:\n${s.instructions}`);
  parts.push(`Ticket #${t.num}: ${t.title}` + (t.detail ? `\n\nDetails:\n${t.detail}` : ''));
  const src = t.handoffFrom && getT(t.handoffFrom);
  if (src && src.output) { const by = getS(src.assignee); parts.push(`This ticket was handed to you by ${by ? by.name + ', the ' + by.role : 'a teammate'}, who finished ticket #${src.num} "${src.title}". Build on their work:\n\n${src.output.slice(0, 40000)}`); }
  if (hasPdf) parts.push(`The CEO attached a PDF${t.pdfName ? ` ("${t.pdfName}")` : ''} to this ticket (the document you can see). Read it closely and find what the ticket is about in it.`);
  if (hasImg) parts.push('The CEO attached a screenshot to this ticket (the image you can see). Study it closely: it shows what they are looking at.');
  if (t.notes?.length) parts.push('Notes the CEO gave you while you worked. Follow them:\n- ' + t.notes.join('\n- '));
  parts.push(FORMATS[t.kind] || FORMATS.writing);
  const first = parts.join('\n\n');
  if (!t.feedback?.length) return first;
  // Revision: a real back-and-forth. The agent's last PR is its own earlier turn, the CEO's review is the new one.
  const ask = 'The CEO reviewed your PR #' + t.pr + ' and requested changes. Address all of it:\n- ' + t.feedback.join('\n- ') +
    '\n\nSend the complete revised deliverable, not just the changed parts. ' + (FORMATS[t.kind] || FORMATS.writing);
  if (!t.output || compact) return first + '\n\n' + ask.replace('your PR #' + t.pr, 'your earlier attempt');
  return [{ role: 'user', content: first }, { role: 'assistant', content: t.output.slice(0, 40000) }, { role: 'user', content: ask }];
}
function nextNum(field) { return S.tickets.reduce((m, t) => Math.max(m, t[field] || 0), 0) + 1; }

async function startRun(ticketId) {
  const t0 = getT(ticketId); const s = t0 && getS(t0.assignee);
  if (!S.sample || !s || runs[s.id]) return;
  const run = runs[s.id] = { ticketId, ctl: new AbortController(), text: '', phase: 'thinking', redirect: false };
  await patchTicket(ticketId, { status: 'working', lastError: null, lastErrorDetail: null, startedAt: Date.now() });
  selectedId = selectedId || s.id;
  paintScreens(); renderBoard();
  const t = getT(ticketId);
  run.notes = (t.notes || []).length;
  let images = null;
  if (memImages[t.id] || t.imageId) {
    try {
      const lim = await S.sample.limits();
      if (lim && lim.images) images = memImages[t.id] || await window.officeBlob(t.imageId);
    } catch { images = null; }
  }
  const ask = compact => S.sample(buildPrompt(t, s, compact, !!images, !!t.pdfId), {
    signal: run.ctl.signal, cache: false, ...(images ? { images } : {}), ...(t.pdfId ? { pdf: t.pdfId } : {}),
    onText: ({ text }) => { run.text = text; run.phase = 'writing'; paintScreens(); },
  });
  try {
    let res;
    try { res = await ask(false); }
    catch (e) {
      // A revision that fails before writing anything gets one more try without the earlier PR attached.
      if (!t.feedback?.length || !e || e.text || !['upstream_error', 'invalid_request', 'transform_error', undefined].includes(e.code)) throw e;
      console.warn('Revision failed, retrying without the earlier PR', e);
      run.text = ''; run.phase = 'thinking'; paintScreens();
      res = await ask(true);
    }
    delete runs[s.id];
    const pr = getT(ticketId).pr || nextNum('pr');
    await patchTicket(ticketId, { status: 'review', output: res.text.slice(0, 200000), truncated: !!res.truncated, pr, notes: [], finishedAt: Date.now() });
    toast(`${s.name} opened PR #${pr}: ${t.title}`);
    handIn(s.id, pr);
  } catch (e) {
    delete runs[s.id];
    if (e && e.code === 'cancelled') {
      if (run.redirect) { paintScreens(); return startRun(ticketId); }
      await patchTicket(ticketId, { status: 'todo' });
    } else {
      const code = e && e.code;
      console.error('Agent run failed', e);
      if (HIDE_CODES.includes(code)) { S.sample = null; showNotice(); }
      await patchTicket(ticketId, { status: 'todo', lastError: (ERR[code] || 'Something went wrong mid-task. Try again.') + ` (${code || 'no code'})`, lastErrorDetail: String((e && (e.message || e)) || '').slice(0, 300) });
    }
  }
  paintScreens(); renderBoard();
}
// Jarvis on the phone (Siri) writes straight to the office records; the open page acts on it here.
const pageOpenedAt = Date.now(), seenCalls = {};
function remoteChanges() {
  if (!bootDone && S.mode !== 'db') return;
  S.staff.forEach(s => {
    if (s.calledAt && s.calledAt > Math.max(seenCalls[s.id] || 0, pageOpenedAt - 120000)) { seenCalls[s.id] = s.calledAt; callToOffice(s.id); }
  });
  Object.entries(runs).forEach(([sid, r]) => {
    const t = getT(r.ticketId);
    if (t && !r.redirect && (t.notes || []).length > r.notes) { r.redirect = true; r.ctl.abort(); toast(`${getS(sid)?.name || 'An agent'} got a new note from Jarvis`); }
  });
  if (!S.sample) return;
  S.tickets.filter(t => t.autoStart && (t.status === 'todo' || t.status === 'changes')).sort((a, b) => a.num - b.num).forEach(t => {
    const s = getS(t.assignee);
    if (!s || runs[s.id]) return;
    patchTicket(t.id, { autoStart: false }).then(() => startRun(t.id));
  });
}
function stopRun(staffId) { const r = runs[staffId]; if (r) r.ctl.abort(); }
async function redirectRun(staffId, note) {
  const r = runs[staffId]; if (!r || !note) return;
  const t = getT(r.ticketId);
  await patchTicket(r.ticketId, { notes: [...(t.notes || []), note] });
  r.notes = (t.notes || []).length + 1;
  r.redirect = true; r.ctl.abort();
  toast(`Told ${getS(staffId).name}: "${note}"`);
}

// ================= PR review =================
function extractHtml(text) { const m = text.match(/```(?:html)?\s*\n([\s\S]*?)(```|$)/i); return (m ? m[1] : text).trim(); }
function inline(s) { return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>'); }
function md(src) {
  const out = [], lines = src.split('\n'); let i = 0, list = false, para = [];
  const endPara = () => { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } };
  const endList = () => { if (list) { out.push('</ul>'); list = false; } };
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*```/.test(l)) { endPara(); endList(); const buf = []; i++; while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]); i++; out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue; }
    const h = l.match(/^(#{1,4})\s+(.*)/);
    if (h) { endPara(); endList(); const n = Math.min(4, h[1].length + 1); out.push(`<h${n}>${inline(h[2])}</h${n}>`); i++; continue; }
    const li = l.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
    if (li) { endPara(); if (!list) { out.push('<ul>'); list = true; } out.push('<li>' + inline(li[1]) + '</li>'); i++; continue; }
    if (!l.trim()) { endPara(); endList(); i++; continue; }
    endList(); para.push(l); i++;
  }
  endPara(); endList(); return out.join('');
}
// ================= screens (live monitors) =================
const liveCards = new Set();
function screenCard(s, where) {
  const el = document.createElement('div');
  el.className = 'scr' + (where === 'ceo' ? ' boxed' : '');
  el.dataset.id = s.id; el.dataset.where = where;
  el.innerHTML = `
    <div class="scr-top" title="Open ${esc(s.name)}"><span class="av" style="background:${s.color}"></span>
      <div class="who"><b></b><small></small></div><span class="pill"></span></div>
    <div class="monitor"><pre class="screen" aria-live="off"></pre></div>
    <div class="scr-btns"></div>
    <form class="say"><input type="text" maxlength="300" aria-label="Note for ${esc(s.name)}"><button type="submit" class="small">Redirect</button></form>`;
  if (where === 'insp') el.querySelector('.scr-top').hidden = true;
  el.querySelector('.scr-top').onclick = () => select('agent', s.id);
  el.querySelector('.say').addEventListener('submit', e => {
    e.preventDefault(); const inp = e.target.querySelector('input');
    const note = inp.value.trim(); if (!note) return;
    redirectRun(s.id, note); inp.value = '';
  });
  liveCards.add(el);
  return el;
}
function updateCard(el) {
  const s = getS(el.dataset.id); if (!s) return;
  const run = runs[s.id], t = run ? getT(run.ticketId) : null;
  el.querySelector('.who b').textContent = s.name; el.querySelector('.av').textContent = s.name[0];
  el.querySelector('.av').style.background = s.color;
  el.querySelector('.say input').placeholder = `Tell ${s.name} something…`;
  el.querySelector('.who small').textContent = t ? `#${t.num} ${t.title}` : s.role;
  const pill = el.querySelector('.pill'), scr = el.querySelector('.screen'), btns = el.querySelector('.scr-btns');
  const queued = S.tickets.filter(x => x.assignee === s.id && (x.status === 'todo' || x.status === 'changes')).sort((a, b) => a.num - b.num);
  const stale = S.tickets.find(x => x.assignee === s.id && x.status === 'working' && !run);
  if (run) {
    pill.textContent = run.phase === 'thinking' ? 'Thinking' : 'Live'; pill.className = 'pill live';
    const head = `<span class="dim">${esc(s.name.toLowerCase())}@office ~ ticket #${t ? t.num : '?'}</span>\n`;
    const body = run.text ? esc(run.text.slice(-4000)) : '<span class="dim">Reading the ticket and planning…</span>\n';
    const atBottom = scr.scrollHeight - scr.scrollTop - scr.clientHeight < 30;
    scr.innerHTML = head + body + '<span class="cur"></span>';
    if (atBottom) scr.scrollTop = scr.scrollHeight;
  } else {
    pill.textContent = stale ? 'Interrupted' : 'Idle'; pill.className = 'pill' + (stale ? ' warn' : '');
    const last = S.tickets.filter(x => x.assignee === s.id && x.output).sort((a, b) => (b.finishedAt || 0) - (a.finishedAt || 0))[0];
    const html = `<span class="dim">${esc(s.name.toLowerCase())}@office ~ idle</span>\n\n` +
      (queued.length ? `${queued.length} ticket${queued.length > 1 ? 's' : ''} waiting. Press Start to put ${esc(s.name)} to work.` : 'No tickets waiting. Give me something to do.') +
      (last ? `\n\n<span class="dim">last PR: #${last.pr} ${esc(last.title)}</span>` : '') + '\n<span class="cur"></span>';
    if (scr.dataset.idle !== html) { scr.dataset.idle = html; scr.innerHTML = html; }
  }
  if (!run) delete scr.dataset.run; else delete scr.dataset.idle;
  el.querySelector('.say button').disabled = !run;
  el.querySelector('.say input').disabled = !run;
  const want = [s.name, run ? 'stop' : stale ? 'resume:' + stale.id : queued[0] ? 'start:' + queued[0].id : 'none', S.sample ? 1 : 0].join('|');
  if (btns.dataset.want !== want) {
    btns.dataset.want = want; btns.innerHTML = '';
    const add = (label, fn, cls, dis) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'small ' + (cls || ''); b.textContent = label; b.disabled = !!dis; b.onclick = fn; btns.append(b); };
    if (run) add('Stop', () => stopRun(s.id));
    else if (stale) add(`Resume #${stale.num}`, () => startRun(stale.id), 'primary', !S.sample);
    else if (queued[0]) add(`Start #${queued[0].num}`, () => startRun(queued[0].id), 'primary', !S.sample);
    add('New ticket for ' + s.name, () => select('newticket', s.id), 'ghost');
    if (el.dataset.where !== 'insp') add('Edit', () => select('agent', s.id), 'ghost');
  }
}
function syncCeo() {
  const grid = $('ceo-grid'), ids = staffSorted().map(s => s.id);
  if (grid.dataset.ids !== ids.join()) {
    grid.dataset.ids = ids.join();
    grid.querySelectorAll('.scr').forEach(c => liveCards.delete(c));
    grid.innerHTML = '';
    ids.forEach(id => grid.append(screenCard(getS(id), 'ceo')));
    if (!ids.length) grid.innerHTML = '<p class="empty">No agents on staff. Hire one to see their screen here.</p>';
  }
}
function paintScreens() {
  for (const c of liveCards) {
    if (!c.isConnected) { liveCards.delete(c); continue; }
    if (c.dataset.where === 'ceo' && view !== 'ceo') continue;
    updateCard(c);
  }
  $('st-work').textContent = Object.keys(runs).length;
}

// ================= board =================
function colOf(t) { return t.status === 'changes' ? 'todo' : t.status; }
function renderBoard() {
  const cols = { todo: [], working: [], review: [], merged: [] };
  S.tickets.forEach(t => (cols[colOf(t)] || cols.todo).push(t));
  cols.merged.sort((a, b) => (b.mergedAt || 0) - (a.mergedAt || 0));
  ['todo', 'working', 'review'].forEach(k => cols[k].sort((a, b) => a.num - b.num));
  document.querySelectorAll('#board .col').forEach(col => {
    const k = col.dataset.col, list = cols[k], box = col.querySelector('.col-list');
    col.querySelector('h3 span').textContent = list.length;
    box.innerHTML = '';
    if (!list.length) box.innerHTML = `<p class="empty">${{ todo: 'No open tickets. Press New ticket to add one.', working: 'Nobody is working right now.', review: 'No pull requests waiting on you.', merged: 'Finished work shows up here.' }[k]}</p>`;
    list.forEach(t => box.append(ticketEl(t)));
  });
  $('st-open').textContent = cols.todo.length;
  $('st-pr').textContent = cols.review.length;
  $('st-merged').textContent = cols.merged.length;
}
function ticketEl(t) {
  const s = getS(t.assignee), el = document.createElement('div');
  el.className = 'tk' + (insp.mode === 'ticket' && insp.id === t.id ? ' sel' : '');
  el.tabIndex = 0; el.setAttribute('role', 'button');
  if (s) { el.style.setProperty('--agent', s.color); el.classList.add('owned'); }
  const tag = t.pr && (t.status === 'review' || t.status === 'merged') ? 'PR #' + t.pr : '#' + t.num;
  const state = t.status === 'changes' ? '<span class="pill warn">Changes</span>' : t.status === 'working' && !(s && runs[s.id]) ? '<span class="pill warn">Interrupted</span>' : t.status === 'working' ? '<span class="pill live">Live</span>' : t.lastError ? '<span class="pill warn">Failed</span>' : '';
  el.innerHTML = `<div class="tk-t"><small>${tag}</small>${esc(t.title)}</div>
    <div class="tk-meta"><span class="kind ${t.kind}">${KIND_LABEL[t.kind] || 'Task'}</span>${s ? `<span class="av xs" style="background:${s.color}">${esc(s.name[0])}</span>${esc(s.name)}` : 'Unassigned'}<span class="grow"></span>${state}</div>`;
  el.onclick = () => select('ticket', t.id);
  el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select('ticket', t.id); } };
  return el;
}

// ================= edit panel =================
let insp = { mode: 'agent', id: null }, inspKey = '';
const narrow = () => matchMedia('(max-width: 900px), (max-height: 520px)').matches;
function select(mode, id) {
  insp = { mode, id };
  if (mode === 'agent') selectedId = id;
  closePreview();
  if (inFocus()) togglePanel(true);
  renderInspector(); renderBoard();
  if (narrow()) $('insp').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function syncField(el, v) { if (document.activeElement !== el && el.value !== (v ?? '')) el.value = v ?? ''; }
function savedFlash() { const n = $('insp').querySelector('.saved'); if (!n) return; n.textContent = 'Saved'; clearTimeout(savedFlash.h); savedFlash.h = setTimeout(() => n.textContent = '', 1500); }
const saveT = {};
function autosave(el, kind, id, field) {
  const key = kind + id + field;
  const go = () => {
    clearTimeout(saveT[key]);
    const cur = kind === 'staff' ? getS(id) : getT(id); if (!cur) return;

}
function drawBubble(a) {
  if (!a.bubble) return;
  ctx.font = '12px "Atkinson Hyperlegible", system-ui, sans-serif';
  const text = a.bubble.length > 32 ? a.bubble.slice(0, 31) + '…' : a.bubble;
  const tw = ctx.measureText(text).width + 14, bh = 20;
  const bx = Math.max(14, Math.min(W - 14 - tw, a.x - tw / 2)); let by = a.y - 42; if (by < 12) by = a.y + 26;
  ctx.fillStyle = 'rgba(0,0,0,.18)'; rr(bx + 2, by + 2, tw, bh, 6); ctx.fill();
  ctx.fillStyle = '#fff'; rr(bx, by, tw, bh, 6); ctx.fill();
  if (by < a.y) { ctx.beginPath(); ctx.moveTo(a.x - 5, by + bh); ctx.lineTo(a.x + 1, by + bh + 6); ctx.lineTo(a.x + 5, by + bh); ctx.fill(); }
  ctx.fillStyle = '#1c2230'; ctx.fillText(text, bx + 7, by + 14);
}
const hits = { notes: [], cols: [] }, hover = { note: null };
function draw(t) {
  hits.notes = []; hits.cols = [];
  drawRoom(t);
  const list = Object.values(actors).sort((p, q) => p.y - q.y);
  list.forEach(drawActor); list.forEach(drawBubble);
  if (S.mode === 'loading') { ctx.fillStyle = 'rgba(20,24,33,.45)'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#fff'; ctx.font = '700 26px "Pixelify Sans", monospace'; ctx.textAlign = 'center'; ctx.fillText('Unlocking the office…', W / 2, H / 2); ctx.textAlign = 'left'; }
}
function hitTest(e) {
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  const inBox = b => x >= b.x - 2 && x <= b.x + b.w + 2 && y >= b.y - 2 && y <= b.y + b.h + 2;
  const note = hits.notes.find(inBox); if (note) return { kind: 'note', id: note.id };
  let best = null, bd = 26;
  Object.values(actors).forEach(a => { const d = Math.hypot(a.x - x, a.y - y); if (d < bd) { bd = d; best = a; } });
  if (best) return { kind: 'agent', id: best.id };
  if (hits.cols.some(inBox) || (x > 40 && x < 640 && y > 432 && y < 568)) return { kind: 'board' };
  if (Math.hypot(x - 862, y - 40) < 16) return { kind: 'jarvis' };
  if (x > 684 && x < 950 && y > 10 && y < 221) return { kind: 'ceo' };
  return null;
}
cv.addEventListener('click', e => {
  const h = hitTest(e); if (!h) return;
  if (h.kind === 'note') select('ticket', h.id);
  else if (h.kind === 'agent') select('agent', h.id);
  else if (h.kind === 'board') { if (document.body.classList.contains('focus')) toggleBoard(true); else $('board').scrollIntoView({ block: 'nearest' }); }
  else if (h.kind === 'ceo') setView('ceo');
  else if (h.kind === 'jarvis') openJarvis(true);
});
cv.addEventListener('mousemove', e => {
  const h = hitTest(e);
  hover.note = h && h.kind === 'note' ? h.id : null;
  cv.style.cursor = h ? 'pointer' : 'default';
  const t = hover.note && getT(hover.note);
  cv.title = t ? `#${t.num} ${t.title} (${statusText(t)})` : h && h.kind === 'jarvis' ? 'Talk to Jarvis' : h && h.kind === 'ceo' ? 'Open the CEO office' : h && h.kind === 'board' ? 'Open tickets and PRs' : '';
});
let last = performance.now();
function frame(now) { const dt = Math.min(0.1, (now - last) / 1000); last = now; updateActors(dt); draw(now / 1000); requestAnimationFrame(frame); }
requestAnimationFrame(frame);

// ================= boot =================
renderAll();
const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
use('downloads').then(d => { S.dl = d; renderAll(); });
use('assets').then(a => { S.assets = a; });
setupJarvis();
use('sample').then(fn => { S.sample = fn; renderAll(); showNotice(); remoteChanges(); });
use('db').then(db => {
  if (db) {
    S.db = db; S.mode = 'db';
    let first = true;
    db.collection('staff').onSnapshot(snap => {
      S.staff = snap.docs.map(d => ({ ...d.data(), id: d.id }));
      syncActors(); renderAll(); first = false; remoteChanges();
    }, () => toast("Lost the connection to the office's records. Reload to reconnect."));
    db.collection('tickets').onSnapshot(snap => {
      S.tickets = snap.docs.map(d => ({ ...d.data(), id: d.id }));
      renderAll(); remoteChanges();
    }, () => {});
  } else {
    S.mode = 'local';
    const now = Date.now();
    [['Juno', 'Frontend engineer', 'Prefer plain HTML and CSS. Keep it accessible.'], ['Ren', 'Product designer', 'Bold, clean layouts. Always offer options.'], ['Bill', 'Educator', 'You are a patient tutor. Explain in short, easy steps and double-check the answer.']]
      .forEach(([name, role, instructions], i) => S.staff.push({ id: 'demo' + i, name, role, instructions, color: PALETTE[i], hiredAt: now + i }));
    S.tickets.push({ id: 'demo-t1', num: 1, title: 'Example: three hero section variations', detail: 'For a note-taking app called Inkwell.', kind: 'design', assignee: 'demo1', status: 'todo', createdAt: now });
    syncActors(); renderAll();
  }
  bootDone = true; showNotice();
});
setTimeout(() => { if (!bootDone) return; showNotice(); }, 11000);
})();
</script>
